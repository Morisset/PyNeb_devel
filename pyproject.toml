[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyneb"
version = "1.1.31"
requires-python = ">= 3.8"
dynamic = ["dependencies"]
description = "A Python package for nebular analysis"
authors = [
    { name = "Christophe Morisset", email = "chris.morisset@gmail.com" },
    { name = "Valentina Luridiana"}
]
license = { file = "LICENCE.md" }
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["nebular", "analysis", "astronomy"]

[project.urls]
Homepage = "http://www.iac.es/proyecto/PyNeb/"
Repository = "https://github.com/Morisset/PyNeb_devel"
Documentation = "http://morisset.github.io/PyNeb_devel/"
Changelog = "https://github.com/Morisset/PyNeb_devel/tree/master/docs/CHANGES"

[tool.setuptools]
packages=['pyneb',
		  'pyneb.core',
		  'pyneb.plot',
		  'pyneb.plot.level_diagrams',
		  'pyneb.utils',
		  'pyneb.extinction',
		  'pyneb.atomic_data',
		  'pyneb.atomic_data.levels',
		  'pyneb.atomic_data.deprecated',
		  'pyneb.atomic_data_fits',
		  'pyneb.atomic_data_fits.old_fits']

[tool.setuptools.package-data]
'pyneb.atomic_data'=['*.dat',
			     '*.func',
			     '*.txt']
'pyneb.atomic_data.levels'=['*.dat']
'pyneb.atomic_data.deprecated'=['*.dat']
'pyneb.atomic_data_fits'=['*.fits',
			     '*.hdf5']
'pyneb.atomic_data_fits.old_fits'=['*.fits']
'pyneb.extinction'=['*.txt']
'pyneb.plot.level_diagrams'=['*.png']

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = [ "tests"]
filterwarnings = [
    # plt.show() is a no-op on the Agg backend used by the test suite
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]
